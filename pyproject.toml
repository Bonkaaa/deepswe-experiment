[project]
name = "deepswe-experiment"
version = "0.1.0"
description = "Controlled test-availability experiments for DeepSWE tasks"
requires-python = ">=3.12,<3.13"
dependencies = [
    "docker>=7.1,<8",
    "langchain>=1.0,<2",
    "langchain-google-genai>=4.0,<5",
    "langchain-ollama>=0.2,<1",
    "python-dotenv>=1.0,<2",
    "tzdata>=2025.2",
    "PyYAML>=6.0,<7",
]

[project.scripts]
deepswe-exp = "deepswe_exp.__main__:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepswe_exp"]

[tool.uv]
package = true
