[project]
name = "deepswe-experiment"
version = "0.1.0"
description = "Controlled test-availability experiments for DeepSWE tasks"
requires-python = ">=3.12,<3.13"
dependencies = [
    "docker>=7.1,<8",
    "langchain>=1.0,<2",
    "langchain-google-genai>=4.0,<5",
    "langchain-ollama>=0.2,<1",
    "python-dotenv>=1.0,<2",
    "tzdata>=2025.2",
    "PyYAML>=6.0,<7",
    "mini-swe-agent>=2.4.6,<3.0.0",
    "swebench @ git+https://github.com/SWE-bench/SWE-bench.git@02e7a74ffd0b707aab73d203fe87bdc7c76afc8e",
]

[project.scripts]
deepswe-exp = "deepswe_exp.__main__:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepswe_exp"]
artifacts = ["src/deepswe_exp/components/tasks/filter_go_tests.go"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
package = true
