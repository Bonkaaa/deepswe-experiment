profile_id: saturn
provider: vllm
study_config: config/study.saturn.yaml
model: Qwen/Qwen3.8-27B-FP8
vllm:
  base_url: http://127.0.0.1:11436/v1
  venv_dir: .local/vllm-saturn/venv
  hf_home: .local/vllm-saturn/hf_cache
  state_dir: .local/vllm-saturn
  cuda_visible_devices: "0,1"
  num_gpus: 2
  num_ctx: 262144
  context_safety_tokens: 16384
  temperature: 0.0
  gpu_memory_utilization: 0.90
  kv_cache_dtype: auto
  max_num_seqs: 16
  tool_call_parser: qwen3_coder
  reasoning_parser: qwen3
